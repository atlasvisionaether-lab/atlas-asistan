<?xml version="1.0" encoding="UTF-8"?>
<!-- Atlas Asistan — marka işareti. Gök küresi (yıldız haritası) + takımyıldızı "A" + yapay zekâ yörüngesi; tepede yıldız. Altın/cyan, koyu zemin için. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Atlas Asistan">
  <title>Atlas Asistan</title>
  <defs>
    <linearGradient id="am-gold" x1="20" y1="8" x2="44" y2="52" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fff7d6"/><stop offset=".38" stop-color="#fde68a"/><stop offset=".72" stop-color="#fbbf24"/><stop offset="1" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="am-sphere" x1="10" y1="8" x2="54" y2="58" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fde68a"/><stop offset=".55" stop-color="#fbbf24" stop-opacity=".75"/><stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <linearGradient id="am-orbit" x1="3" y1="43" x2="61" y2="29" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#22d3ee" stop-opacity=".2"/><stop offset=".55" stop-color="#67e8f9"/><stop offset="1" stop-color="#a5f3fc" stop-opacity=".55"/>
    </linearGradient>
    <radialGradient id="am-core" cx="32" cy="30" r="27" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#312e81" stop-opacity=".55"/><stop offset=".7" stop-color="#0b0620" stop-opacity=".35"/><stop offset="1" stop-color="#0b0620" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="am-starfill" cx="32" cy="12" r="7.5" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff"/><stop offset=".45" stop-color="#fff7d6"/><stop offset="1" stop-color="#fbbf24"/>
    </radialGradient>
  </defs><style>
  .am-star{transform-origin:32px 12px;animation:am-tw 3.6s ease-in-out infinite}
  .am-sat{animation:am-pulse 3.6s ease-in-out infinite}
  @keyframes am-tw{0%,100%{transform:scale(1) rotate(0deg);opacity:1}50%{transform:scale(.78) rotate(45deg);opacity:.82}}
  @keyframes am-pulse{0%,100%{opacity:1}50%{opacity:.45}}
  @media (prefers-reduced-motion:reduce){.am-star,.am-sat{animation:none}}
</style>
  <circle cx="32" cy="32" r="26" fill="url(#am-core)"/>
  <ellipse cx="32" cy="32" rx="11" ry="26" fill="none" stroke="#fde68a" stroke-opacity=".3" stroke-width="0.80"/>
  <ellipse cx="32" cy="32" rx="26" ry="7.5" fill="none" stroke="#fde68a" stroke-opacity=".22" stroke-width="0.80"/>
  <path d="M2.89 43.26 A30 8.5 -14 0 1 61.11 28.74" fill="none" stroke="url(#am-orbit)" stroke-opacity=".55" stroke-width="1.40" stroke-linecap="round"/>
  <circle cx="32" cy="32" r="26" fill="none" stroke="url(#am-sphere)" stroke-width="1.60"/>
  <path d="M32 13 L19 49 M32 13 L45 49" fill="none" stroke="url(#am-gold)" stroke-width="2.60" stroke-linecap="round"/>
  <path d="M61.11 28.74 A30 8.5 -14 0 1 2.89 43.26" fill="none" stroke="url(#am-orbit)" stroke-width="1.70" stroke-linecap="round"/>
  <circle cx="19" cy="49" r="2.10" fill="#a5f3fc"/>
