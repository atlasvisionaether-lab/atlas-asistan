<?xml version="1.0" encoding="UTF-8"?>
<!-- Atlas Asistan — marka işareti. Gök küresi (yıldız haritası) + takımyıldızı "A" + yapay zekâ yörüngesi; tepede yıldız. Altın/cyan, koyu zemin için. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Atlas Asistan">
  <title>Atlas Asistan</title>
  <circle cx="32" cy="32" r="31" fill="#07041a"/>
  <defs>
    <linearGradient id="af-gold" x1="20" y1="8" x2="44" y2="52" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fff7d6"/><stop offset=".38" stop-color="#fde68a"/><stop offset=".72" stop-color="#fbbf24"/><stop offset="1" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="af-sphere" x1="10" y1="8" x2="54" y2="58" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fde68a"/><stop offset=".55" stop-color="#fbbf24" stop-opacity=".75"/><stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <linearGradient id="af-orbit" x1="3" y1="43" x2="61" y2="29" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#22d3ee" stop-opacity=".2"/><stop offset=".55" stop-color="#67e8f9"/><stop offset="1" stop-color="#a5f3fc" stop-opacity=".55"/>
    </linearGradient>
    <radialGradient id="af-core" cx="32" cy="30" r="27" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#312e81" stop-opacity=".55"/><stop offset=".7" stop-color="#0b0620" stop-opacity=".35"/><stop offset="1" stop-color="#0b0620" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="af-starfill" cx="32" cy="12" r="7.5" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff"/><stop offset=".45" stop-color="#fff7d6"/><stop offset="1" stop-color="#fbbf24"/>
    </radialGradient>
