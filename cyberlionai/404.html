<!DOCTYPE html>
<html lang="tr" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0a0a0f" />
  <title>404 — Sayfa Bulunamadı | Cyber Lion AI</title>
  <meta name="robots" content="noindex, follow" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800;900&family=Space+Grotesk:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 48 48'%3E%3Cpath d='M24 3 L42 9 V23 C42 34 34 41.5 24 45 C14 41.5 6 34 6 23 V9 Z' fill='%230a0a0f' stroke='%23d4af37' stroke-width='2.5'/%3E%3Ccircle cx='24' cy='22' r='9' fill='none' stroke='%23d4af37' stroke-width='2.5'/%3E%3C/svg%3E" />
  <style>
    :root{--black:#0a0a0f;--gold:#d4af37;--gold-light:#ffdf00;--blue:#00d4ff;
      --white:#f0f0f0;--gray:#a0a0b0;--line:rgba(212,175,55,.2);
      --ease:cubic-bezier(.4,0,.2,1)}
    *{box-sizing:border-box}
    body{margin:0;min-height:100svh;display:flex;align-items:center;justify-content:center;
      padding:32px 20px;text-align:center;background:var(--black);color:var(--white);
      font-family:'Space Grotesk',sans-serif;line-height:1.7;
      background-image:radial-gradient(55% 45% at 50% 110%,rgba(255,77,0,.16),transparent 70%),
                       radial-gradient(45% 40% at 50% -10%,rgba(212,175,55,.14),transparent 70%)}
    svg.mark{width:78px;height:78px;filter:drop-shadow(0 0 18px rgba(212,175,55,.5));margin-bottom:26px}
    .code{font-family:'Orbitron',sans-serif;font-weight:900;font-size:clamp(3.4rem,15vw,6.4rem);
      line-height:1;color:var(--gold);letter-spacing:.06em;margin:0;
      text-shadow:0 0 22px rgba(212,175,55,.3),0 0 60px rgba(212,175,55,.15)}
    h1{font-family:'Orbitron',sans-serif;font-weight:700;font-size:clamp(1.05rem,3.6vw,1.45rem);
      letter-spacing:.05em;margin:18px 0 12px}
    p{color:var(--gray);max-width:460px;margin:0 auto 32px}
    .actions{display:flex;flex-wrap:wrap;gap:12px;justify-content:center}
    a.btn{display:inline-flex;align-items:center;gap:9px;text-decoration:none;
      font-family:'Orbitron',sans-serif;font-weight:600;font-size:.78rem;letter-spacing:.09em;
      text-transform:uppercase;padding:14px 28px;border-radius:10px;
      transition:transform .3s var(--ease),box-shadow .3s var(--ease),
                 border-color .3s var(--ease),color .3s var(--ease)}
    a.btn:hover{transform:scale(1.05)}
    .primary{background:linear-gradient(135deg,var(--gold-light),var(--gold));color:#0a0a0f;
      box-shadow:0 10px 30px -12px rgba(212,175,55,.7)}
    .ghost{border:1px solid var(--line);color:var(--white);background:rgba(255,255,255,.03)}
    .ghost:hover{border-color:var(--gold);color:var(--gold)}
    .lang{margin-top:34px;display:flex;gap:8px;justify-content:center}
    .lang button{font:inherit;font-family:'Orbitron',sans-serif;font-size:.68rem;font-weight:600;
      letter-spacing:.06em;padding:7px 12px;border-radius:7px;cursor:pointer;
      border:1px solid var(--line);background:rgba(255,255,255,.03);color:var(--gray)}
    .lang button[aria-pressed="true"]{color:#0a0a0f;border-color:transparent;
      background:linear-gradient(135deg,var(--gold-light),var(--gold))}
    @media(prefers-reduced-motion:reduce){*{transition-duration:.001ms!important}}
  </style>
</head>
<body>
  <main>
    <svg class="mark" viewBox="0 0 48 48" aria-hidden="true">
      <path d="M24 3 L42 9 V23 C42 34 34 41.5 24 45 C14 41.5 6 34 6 23 V9 Z" fill="rgba(212,175,55,.07)" stroke="#d4af37" stroke-width="2.2" stroke-linejoin="round"/>
      <path fill="#d4af37" d="M24 11 L26.07 14.27 L29.5 12.47 L29.66 16.34 L33.53 16.5 L31.73 19.93 L35 22 L31.73 24.07 L33.53 27.5 L29.66 27.66 L29.5 31.53 L26.07 29.73 L24 33 L21.93 29.73 L18.5 31.53 L18.34 27.66 L14.47 27.5 L16.27 24.07 L13 22 L16.27 19.93 L14.47 16.5 L18.34 16.34 L18.5 12.47 L21.93 14.27 Z"/>
      <circle cx="24" cy="22" r="6.4" fill="#0a0a0f"/>
      <g stroke="#ffdf00" stroke-width="1.5" stroke-linecap="round" fill="none">
        <path d="M20.2 20.4 L22.4 21.2"/><path d="M27.8 20.4 L25.6 21.2"/>
        <path d="M24 23.6 L25.5 24.8 L24 26.1 L22.5 24.8 Z"/>
      </g>
    </svg>

    <p class="code">404</p>
    <h1 data-tr="BU İZ BİR YERE ÇIKMIYOR" data-en="THIS TRAIL LEADS NOWHERE">BU İZ BİR YERE ÇIKMIYOR</h1>
    <p data-tr="Aradığınız sayfa taşınmış veya hiç var olmamış olabilir. Ana sayfadan devam edebilir ya da doğrudan bir tarama başlatabilirsiniz."
       data-en="The page you are looking for may have moved, or may never have existed. Head back home or start a scan directly.">Aradığınız sayfa taşınmış veya hiç var olmamış olabilir. Ana sayfadan devam edebilir ya da doğrudan bir tarama başlatabilirsiniz.</p>

    <div class="actions">
      <a class="btn primary" href="/" data-tr="Ana Sayfa" data-en="Home">Ana Sayfa</a>
      <a class="btn ghost" href="/#pricing" data-tr="Fiyatlandırma" data-en="Pricing">Fiyatlandırma</a>
    </div>

    <div class="lang" role="group" aria-label="Dil / Language">
      <button type="button" data-lang="tr" aria-pressed="true">TR</button>
      <button type="button" data-lang="en" aria-pressed="false">EN</button>
    </div>
  </main>

  <script>
  (function () {
    'use strict';
    function store(k, v) {
      try { return v === undefined ? localStorage.getItem(k) : localStorage.setItem(k, v); }
      catch (e) { return null; }
    }
    function apply(lang) {
      document.documentElement.setAttribute('lang', lang);
      var nodes = document.querySelectorAll('[data-tr]');
      for (var i = 0; i < nodes.length; i++) nodes[i].textContent = nodes[i].getAttribute('data-' + lang);
      var btns = document.querySelectorAll('.lang button');
      for (var j = 0; j < btns.length; j++) {
        btns[j].setAttribute('aria-pressed', btns[j].getAttribute('data-lang') === lang ? 'true' : 'false');
      }
      document.title = (lang === 'tr' ? '404 — Sayfa Bulunamadı' : '404 — Page Not Found') + ' | Cyber Lion AI';
    }
    var saved = store('preferredLang');
    var browser = (navigator.language || 'en').toLowerCase().indexOf('tr') === 0 ? 'tr' : 'en';
    apply(saved === 'tr' || saved === 'en' ? saved : browser);
    var btns = document.querySelectorAll('.lang button');
    for (var b = 0; b < btns.length; b++) {
      btns[b].addEventListener('click', function () {
        var l = this.getAttribute('data-lang');
        store('preferredLang', l);
        apply(l);
      });
    }
  })();
  </script>
</body>
</html>
