# CyberLion AI mobil istemcisinin bildirim parçası için gereken bağımlılıklar.
#
# Bu dosya bir Flutter projesi DEĞİL: depoda mobil uygulama yok. Uygulama
# açıldığında bu üç satır kendi pubspec.yaml'ına eklenir ve
# lib/services/push_token_service.dart olduğu gibi kopyalanır.
#
# Sürümler sabitlenmedi (caret): Firebase eklentileri platform SDK'larıyla
# birlikte ilerliyor, burada bir sürümü dondurmak uygulamayı eski bir Firebase
# BoM'una bağlardı. `flutter pub get` çözümlemeyi yapar.

dependencies:
  flutter:
    sdk: flutter

  firebase_core: ^3.6.0 # Firebase.initializeApp — jeton almadan önce şart
  firebase_messaging: ^15.1.3 # getToken, onTokenRefresh, requestPermission
  http: ^1.2.2 # POST/DELETE /api/device-token
