name: Araç sınamaları

# Ağ gerektirmeyen sınamalar. Her PR'da ve main'e her işlemede koşar.
#
# Neden ayrı bir iş akışı: feeds-probe.yml yalnızca elle tetikleniyor. Oraya
# konan bir sınama, kimse elle koşturmadıkça sessizce çürür — koruma olmaz.
# Buradaki sınamalar dış ağa çıkmıyor, saniyeler sürüyor ve gerçekten kapı
# tutuyor.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Kimlik duvari algilamasi. Bu bozulursa karsilastirma betigi yine
      # korumali bir hedefte anlamsiz bir mutabakat orani uretebilir.
      - name: Kimlik duvarı algılaması
        run: bash cyberlionai/tools/wall-test.sh

      # Akis sayaci girdi basina mi sayiyor. Bu bozulursa haritadaki sayi
      # sessizce sisir ve ulke siralamasi bozulur.
      - name: Akış sayacı (girdi başına sayım)
        run: node cyberlionai/tools/counter-test.js

      # Capraz koken kontrolleri. Yanlis alarm burada yalnizca gurultu degil:
      # Observatory ile sahte bir mutabakatsizlik uretirdi.
      - name: Çapraz köken kontrolleri (COOP/COEP/CORP/CORS/SRI)
        run: node cyberlionai/tools/crossorigin-test.js

      # Mutabakat tablosunun eslemesi. Bu bozulursa iki arac AYNI harfi
      # FARKLI gercekler icin uretip sahte bir %100 mutabakat gosterir.
      - name: Mutabakat tablosu eşlemesi
        run: node cyberlionai/tools/compare-map-test.js

      # Gunluk besleme sagligi kosusunun karar mantigi. Bu bozulursa dusen bir
      # besleme "temiz" gorunur ve harita sessizce zayiflar.
      - name: Harita doğrulamasının karar mantığı
        run: bash cyberlionai/tools/worldmap-verify-test.sh

      # Zaman penceresi: ayristirici ulke basina pencere uretiyor mu ve on yuz
      # onu gercekten tuketiyor mu. Bu bozulursa filtre yine sessizce olur.
      - name: Zaman penceresi filtresi
        run: node cyberlionai/tools/window-test.js

      # Kendi tarama etkinligimiz katmani: gizlilik (yalnizca ulke disari
      # cikiyor), bicim ve iki sayinin birbirine karismamasi.
      - name: Kendi tarama etkinliği katmanı
        run: node cyberlionai/tools/ownactivity-test.js

      # SPF/DMARC/DKIM ayristiricilari. Ornekler gercek alan adlarindan
      # olculdu; sinama o olcumu sabit tutuyor.
      - name: E-posta kimlik kayıtları
        run: node cyberlionai/tools/mail-test.js

      # CAA ve DNSSEC degerlendiricileri. Olcut DS kaydinin VARLIGI; AD biti
      # tek basina yaniltici (imzali OLUMSUZ yanitta da gelebiliyor).
      - name: CAA ve DNSSEC
        run: node cyberlionai/tools/dnszone-test.js

      # "Puan disi" etiketleri ve cevirilerin eksiksizligi. Bir musteri
      # raporunda ham anahtar ("scan_note_not_implemented") gorundugu icin var.
      - name: Puan dışı etiketleri ve çeviriler
        run: node cyberlionai/tools/skiplabel-test.js

      # Puanlama kalibrasyonu: bantlar ve beyan edilen onem dereceleri.
      - name: Puanlama kalibrasyonu
        run: node cyberlionai/tools/calibration-test.js

      - name: Kabuk betiklerinin sözdizimi
        run: |
          for f in cyberlionai/tools/*.sh; do
            bash -n "$f" || exit 1
          done
          echo "tüm kabuk betikleri ayrıştırıldı"
