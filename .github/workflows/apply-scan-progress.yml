name: Apply hero subtitle fix

on:
  push:
    branches: [feat/scan-progress-ui]
    paths: ['.github/workflows/apply-scan-progress.yml']

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/scan-progress-ui

      - name: Fetch patched index.html and verify
        run: |
          curl -fsSL https://x0.at/dqp5.html -o cyberlionai/index.html
          echo "2d7df682b7cbb1cabe044eb50230de35  cyberlionai/index.html" | md5sum -c -

      - name: Commit to feat/scan-progress-ui
        run: |
          git config user.name "atlas-bot"
          git config user.email "noreply@users.noreply.github.com"
          git add cyberlionai/index.html
          git diff --cached --quiet && echo "no changes" && exit 0
          git commit -m "fix(hero): restore original blue subtitle, remove duplicate-look text"
          git push origin feat/scan-progress-ui
