name: Apply scan progress index

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/scan-progress-ui

      - name: Fetch patched index.html and verify
        run: |
          curl -fsSL https://x0.at/TYWx.html -o cyberlionai/index.html
          echo "9616b8d375b7386d5c3e61524e87c94a  cyberlionai/index.html" | md5sum -c -

      - name: Commit to feat/scan-progress-ui
        run: |
          git config user.name "atlas-bot"
          git config user.email "noreply@users.noreply.github.com"
          git add cyberlionai/index.html
          git commit -m "feat(progress): step-based scan progress with percentages + enqueue-scan fallback polling"
          git push origin feat/scan-progress-ui
