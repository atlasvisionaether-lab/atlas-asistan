name: Hesap silme doğrulaması (test hesabıyla)

# DELETE /api/panel/account ucunun İŞ MANTIĞINI üretim veritabanında,
# kendi açtığı test hesabıyla doğrular. Gerçek bir kullanıcıya DOKUNMAZ.
#
# HTTP uç KULLANILMAZ: Vercel yönlendirmesi/404 riski olmaması için betik
# doğrudan Supabase admin API'siyle çalışır; silme iş mantığı uçta kullanılan
# db.deleteAccountData'nın kendisidir (import edilir).
#
# GEREKLİ GİZLİ DEĞİŞKENLER (Settings → Secrets and variables → Actions):
#   SUPABASE_URL                 proje adresi
#   SUPABASE_SERVICE_ROLE_KEY    servis rolü anahtarı
# İkisi yoksa betik tahmin etmez: "ÖLÇÜLEMEDİ" der ve çıkar.

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Üretim veritabanına test satırı yazılacak: onaylıyorsanız 'evet'"
        required: true
        default: ''

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Bağımlılık kur (@supabase/supabase-js)
        run: npm install --no-save @supabase/supabase-js

      - name: Silme akışını doğrula
        env:
          CONFIRM: ${{ inputs.confirm }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node cyberlionai/tools/account-delete-verify.js
